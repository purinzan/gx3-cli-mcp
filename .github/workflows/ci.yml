name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    # Windows is the primary supported platform. Linux and macOS are covered so
    # that accidental platform assumptions (path separators, casing) are caught,
    # since MCP clients are often run from those hosts.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Check console scripts
        run: |
          gx3-cli --version
          gx3-mcp-server --version

      - name: Run tests
        run: python run_tests.py

      - name: Run source release gate
        run: python scripts/release_gate.py .

  build:
    runs-on: windows-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Run artifact release gate
        run: python scripts/release_gate.py dist/gx3_cli_mcp-*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gx3-cli-mcp-wheel
          path: dist/*.whl
