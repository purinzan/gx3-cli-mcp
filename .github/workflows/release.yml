name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Run source release gate
        run: python scripts/release_gate.py .

      - name: Build wheel and sdist
        run: python -m build

      - name: Run artifact release gate
        run: python scripts/release_gate.py dist/*.whl dist/*.tar.gz

      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.whl | sed -E 's/.*gx3_cli_mcp-([^-]+)-.*/\1/')
          echo "tag=$tag packaged=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match packaged version $pkg (bump version in pyproject.toml)"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Four tags shipped before anyone noticed there were no GitHub Releases to
    # go with them, which reads from the outside as an unmaintained project.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            dist/*
